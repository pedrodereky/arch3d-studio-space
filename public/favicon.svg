<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arq3D Studio">
  <!-- Ladrilho navy sólido: a marca vazada sumiria em abas de tema escuro. -->
  <rect width="64" height="64" rx="13" fill="#02162A"/>
  <!-- O A de Arq como corte. A postura é aberta e as pernas grossas de
       propósito: um A elegante e fino vira borrão aos 16px, que é onde um
       favicon vive. -->
  <path d="M32 12 L55 54 L43 54 L32 32 L21 54 L9 54 Z" fill="#FFFFFF"/>
  <!-- A laje, única peça em azul — é o que separa a letra de um triângulo.
       5/64 garante 1px cheio quando renderizado a 16. -->
  <rect x="16.7" y="39.6" width="30.6" height="5" fill="#7FA8D4"/>
</svg>
