name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatação, lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` exigiria um package-lock.json em dia com o package.json, e o
      # versionado está defasado (não lista @supabase/supabase-js, @xyflow/react
      # e outras dependências que o app importa). `bun install --frozen-lockfile`
      # também não serve aqui: o bun.lockb fixa parte dos pacotes no registry
      # privado da Lovable, que um runner público não acessa (403).
      # Ver a nota sobre lockfiles no README antes de trocar isto.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Formatação
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # As edge functions rodam em Deno e ficam fora do `include` do tsconfig —
      # nada acima as cobre. Este é o único typecheck que elas têm. Instalar via
      # npm evita depender de uma action de terceiros.
      - name: Instalar Deno
        run: npm install -g deno

      - name: Cache de dependências Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-

      # `find` em vez de glob `**`: o shell da action não tem globstar ligado.
      - name: Typecheck das edge functions (Deno)
        run: deno check $(find supabase/functions -name '*.ts')
