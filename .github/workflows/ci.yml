name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatação, lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # O package-lock.json fixa as versões que a CI valida. Sem ele, o
      # npm install resolvia versões novas a cada execução e quebrou quando o
      # @tanstack/react-start passou a exigir o Vite 8. `npm install` (e não
      # `npm ci`) porque o lockfile gerado no macOS não lista os binários
      # opcionais de Linux de workerd/sharp; o npm completa só esses, sem mudar
      # as versões travadas. O bun.lockb continua sendo o da Lovable.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Formatação
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Antes daqui a CI provava que o projeto COMPILA, não que funciona.
      # Roda antes do build: é o passo mais rápido que pode reprovar por motivo
      # de comportamento, e falhar cedo economiza o build.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # As edge functions rodam em Deno e ficam fora do `include` do tsconfig —
      # nada acima as cobre. Este é o único typecheck que elas têm. Instalar via
      # npm evita depender de uma action de terceiros.
      - name: Instalar Deno
        run: npm install -g deno

      - name: Cache de dependências Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-

      # `find` em vez de glob `**`: o shell da action não tem globstar ligado.
      - name: Typecheck das edge functions (Deno)
        run: deno check $(find supabase/functions -name '*.ts')
