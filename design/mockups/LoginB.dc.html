<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;900&display=swap">
  <style>
    body { margin:0; font-family:'Avenir LT Std','Avenir Next',Avenir,'Mulish','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#0A4F95; text-decoration:none; } a:hover { color:#02162A; }
    .lbl { font-size:10px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#6B7A8D; }
  </style>
</helmet>

<div style="width:1440px; height:900px; display:flex; align-items:center; justify-content:center; background:#F0F2F5; color:#02162A; overflow:hidden; position:relative;">
  <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(2,22,42,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(2,22,42,.035) 1px, transparent 1px); background-size:56px 56px;"></div>

  <div style="position:relative; width:452px; display:flex; flex-direction:column; align-items:center;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:28px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#02162A" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z"/><path d="M12 12 21 7.5M12 12v9.5M12 12 3 7.5" stroke-width="1.2"/></svg>
      <span style="font-size:16px; font-weight:900; letter-spacing:-.01em;">Arq3D Studio</span>
    </div>

    <div style="width:100%; padding:40px; border-radius:20px; background:#FFFFFF; box-shadow:0 1px 3px rgba(2,22,42,.08), 0 4px 16px rgba(2,22,42,.06);">
      <h1 style="margin:0; font-size:26px; font-weight:900; letter-spacing:-.02em;">Entrar</h1>
      <p style="margin:8px 0 0; font-size:14px; font-weight:300; color:#6B7A8D;">Acesse sua conta para continuar.</p>

      <div style="display:flex; flex-direction:column; gap:16px; margin-top:28px;">
        <div style="display:flex; flex-direction:column; gap:7px;">
          <span class="lbl">E-mail</span>
          <div style="height:46px; display:flex; align-items:center; padding:0 14px; border-radius:8px; border:1px solid rgba(2,22,42,.15);">
            <span style="font-size:13.5px;">pedro@ayresarquitetura.com.br</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:7px;">
          <span class="lbl">Senha</span>
          <div style="height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-radius:8px; border:1px solid rgba(2,22,42,.15);">
            <span style="font-size:15px; letter-spacing:.2em;">••••••••••</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B7A8D" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:17px; height:17px; border-radius:4px; background:#0A4F95; display:flex; align-items:center; justify-content:center;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
            </div>
            <span style="font-size:12.5px; color:#02162A;">Manter conectado</span>
          </div>
          <span style="font-size:12px; font-weight:600; color:#0A4F95;">Esqueci a senha</span>
        </div>

        <div style="height:48px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:#0A4F95; margin-top:4px;">
          <span style="font-size:11.5px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:#FFFFFF;">Entrar</span>
        </div>

        <div style="display:flex; align-items:center; gap:14px;">
          <div style="flex:1; height:1px; background:rgba(2,22,42,.08);"></div>
          <span style="font-size:10.5px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:#6B7A8D;">ou</span>
          <div style="flex:1; height:1px; background:rgba(2,22,42,.08);"></div>
        </div>

        <div style="height:48px; display:flex; align-items:center; justify-content:center; gap:10px; border-radius:8px; border:1px solid rgba(2,22,42,.15);">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.6 9.4 5.9 12 5.9z"/></svg>
          <span style="font-size:13px; font-weight:600;">Continuar com Google</span>
        </div>
      </div>
    </div>

    <p style="margin:22px 0 0; font-size:13px; color:#6B7A8D;">Ainda não tem conta? <span style="color:#0A4F95; font-weight:600;">Criar conta</span></p>
  </div>
</div>
</x-dc>
</body>
</html>
